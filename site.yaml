# About — one entry per paragraph ─────────────────────────────
about:
  - I build the systems around AI agents — memory, retrieval, and the infrastructure
    that runs them. Lately that means Mash, a searchable memory for coding agents,
    and gohawk, a static analyzer for Go concurrency and resource bugs.
  - At Memorial Sloan Kettering I work on cBioPortal's data platform. I care about
    systems that are observable, predictable, and verified. Most of my work lately
    has been in Rust, Go, Python, and TypeScript on top of Kubernetes and AWS.

