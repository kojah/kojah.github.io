# Experience ──────────────────────────────────────────────────
experience:
  - when: Jun 2023 — Present
    title: Bioinformatics Engineer
    org: Memorial Sloan Kettering
    summary: >
      Migrated cBioPortal from MySQL to ClickHouse with blue-green deployments that
      keep the site available during imports. Built a Go microservice that streams
      study data from the NCI Secure Data Enclave. Moved imports from Cron to Airflow
      on Docker and Kubernetes, managed through ArgoCD, and storage to S3 and
      Databricks. Engineered BigQuery ETL pipelines for the National Cancer Institute.
      Run Hermes Agent, a persistent AI assistant with Slack, Discord, and Telegram
      gateways, on Kubernetes with Karpenter and EC2 Spot.

  - when: Oct 2022 — Jun 2023
    title: Software Engineer
    org: Massachusetts General Hospital
    summary: >
      Managed clinical and imaging data ingestion for DISCOVERY and MarkVCID, studies
      of biomarkers for cognitive impairment and dementia. Strengthened MRI validation
      before quality control and anonymized clinical form data for distribution to
      outside researchers.

  - when: May 2021 — May 2022
    title: Research Intern
    org: Boston Children's Hospital
    summary: >
      Built a PyTorch model to predict neurological biomarkers. Evaluated convolutional
      neural networks and sampling strategies for underrepresented age groups, finding
      that oversampling performed best.

